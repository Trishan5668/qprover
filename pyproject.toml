[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qprover"
version = "0.1.0"
description = "Lean-verified theorem proving experiments with quantum premise selection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
quantum = ["qiskit>=2.0", "qiskit-aer>=0.15", "qiskit-ibm-runtime>=0.36"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
qprover = "qprover.cli:app"

[tool.setuptools.packages.find]
include = ["qprover*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=qprover --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
omit = ["qprover/cli.py", "qprover/__main__.py", "qprover/quantum/runtime.py"]
